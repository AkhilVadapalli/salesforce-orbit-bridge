<template>
    <lightning-card title="Hours Review">
        <div class="slds-p-around_medium">
            <template if:true={hasApproveAccess}>
                <lightning-button label="Approve Hours" variant="brand" onclick={openModal}></lightning-button>
            </template>
            <template if:false={hasApproveAccess}>
                <div class="slds-text-color_error">You do not have access to approve entries.</div>
            </template>
            <template if:true={isModalOpen}>
                <section role="dialog" tabindex="-1" aria-modal="true" aria-label={modalTitle} class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <lightning-button-icon icon-name="utility:close" variant="bare-inverse" alternative-text="Close" class="slds-modal__close" onclick={closeModal}></lightning-button-icon>
                            <h2 class="slds-text-heading_medium">{modalTitle}</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                <template if:true={hasEntries}>
                    <div class="slds-scrollable_x">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col"><div class="slds-truncate" title="Name">Name</div></th>
                                    <th scope="col"><div class="slds-truncate" title="Date">Date</div></th>
                                    <th scope="col"><div class="slds-truncate" title="Start Time">Start Time</div></th>
                                    <th scope="col"><div class="slds-truncate" title="End Time">End Time</div></th>
                                    <th scope="col"><div class="slds-truncate" title="Hours">Calculated Hours</div></th>
                                    <th scope="col"><div class="slds-truncate" title="Status">Status</div></th>
                                    <th scope="col"><div class="slds-truncate" title="Action">Action</div></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={entries} for:item="entry">
                                    <tr key={entry.Id}>
                                        <td><div class="slds-truncate" title={entry.displayName}>{entry.displayName}</div></td>
                                        <td><div class="slds-truncate" title={entry.Date__c}>{entry.Date__c}</div></td>
                                        <td><div class="slds-truncate" title={entry.displayStartTime}>{entry.displayStartTime}</div></td>
                                        <td><div class="slds-truncate" title={entry.displayEndTime}>{entry.displayEndTime}</div></td>
                                        <td><div class="slds-truncate" title={entry.calculatedHours}>{entry.calculatedHours}</div></td>
                                        <td>
                                            <template if:true={entry.isApproved}>
                                                <lightning-badge label="Approved"></lightning-badge>
                                            </template>
                                            <template if:false={entry.isApproved}>
                                                <span>Pending</span>
                                            </template>
                                        </td>
                                        <td>
                                            <template if:true={entry.isApproved}>
                                                <span>-</span>
                                            </template>
                                            <template if:false={entry.isApproved}>
                                                <lightning-button label="Approve" variant="brand" data-id={entry.Id} onclick={handleApprove}></lightning-button>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template if:false={hasEntries}>
                    <div>No entries found.</div>
                </template>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button label="Close" onclick={closeModal}></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
        </div>
    </lightning-card>
</template>
